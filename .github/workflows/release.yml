name: Release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      SONATYPE_USERNAME: ${{ secrets.SONATYPE_USERNAME }}
      SONATYPE_PASSWORD: ${{ secrets.SONATYPE_PASSWORD }}
      GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
      GPG_PRIVATE_KEY_B64: ${{ secrets.GPG_PRIVATE_KEY_B64 }}
      GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
      MAVEN_GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
      GPG_KEYID: DF3A3908F0D901C00E38B49F676902DE0EB424FF
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'maven'
      - name: Import GPG key
        run: |
          set -euo pipefail
          echo "event=$GITHUB_EVENT_NAME ref=$GITHUB_REF"
          echo "has GPG_PRIVATE_KEY: $([ -n \"${GPG_PRIVATE_KEY:-}\" ] && echo yes || echo no)"
          echo "len GPG_PRIVATE_KEY: ${#GPG_PRIVATE_KEY}"
          echo "has GPG_PRIVATE_KEY_B64: $([ -n \"${GPG_PRIVATE_KEY_B64:-}\" ] && echo yes || echo no)"
          echo "len GPG_PRIVATE_KEY_B64: ${#GPG_PRIVATE_KEY_B64}"
          echo "::add-mask::${GPG_PRIVATE_KEY}"
          echo "::add-mask::${GPG_PRIVATE_KEY_B64}"
          export GNUPGHOME="$RUNNER_TEMP/gnupg"
          install -d -m 700 "$GNUPGHOME"
          printf 'pinentry-mode loopback\n' > "$GNUPGHOME/gpg.conf"
          printf 'allow-loopback-pinentry\n' > "$GNUPGHOME/gpg-agent.conf"
          chmod 600 "$GNUPGHOME/gpg.conf" "$GNUPGHOME/gpg-agent.conf"
          gpgconf --homedir "$GNUPGHOME" --kill gpg-agent || true
          if [ -z "${GPG_PRIVATE_KEY:-}" ] && [ -n "${GPG_PRIVATE_KEY_B64:-}" ]; then
            GPG_PRIVATE_KEY="${GPG_PRIVATE_KEY_B64}"
          fi
          echo "GPG_PRIVATE_KEY env length: ${#GPG_PRIVATE_KEY}"
          if [ -z "${GPG_PRIVATE_KEY:-}" ]; then
            echo "ERROR: GPG_PRIVATE_KEY is empty. Set repository/org Secret GPG_PRIVATE_KEY (ASCII armored) or GPG_PRIVATE_KEY_B64 (base64 of private key)." >&2
            exit 2
          fi
          if echo "$GPG_PRIVATE_KEY" | grep -q "BEGIN PGP PRIVATE KEY BLOCK"; then
            printf '%b' "$GPG_PRIVATE_KEY" | tr -d '\r' > "$GNUPGHOME/import.asc"
          else
            printf '%s' "$GPG_PRIVATE_KEY" | tr -d '\r' | base64 -d > "$GNUPGHOME/import.asc"
          fi
          stat -c '%n %s' "$GNUPGHOME/import.asc"
          head -n 1 "$GNUPGHOME/import.asc"; tail -n 1 "$GNUPGHOME/import.asc"
          gpg --homedir "$GNUPGHOME" --batch --import "$GNUPGHOME/import.asc"
          gpg --homedir "$GNUPGHOME" --list-secret-keys --keyid-format LONG
          echo "GNUPGHOME=$GNUPGHOME" >> $GITHUB_ENV
          gpg --homedir "$GNUPGHOME" --batch --pinentry-mode loopback --passphrase "$GPG_PASSPHRASE" -u "$GPG_KEYID" --sign -a </dev/null >/dev/null
      - name: Deploy to Central
        run: |
          mvn -B -s .mvn/settings.xml -DskipTests -Dgpg.keyname="$GPG_KEYID" -Dgpg.passphrase="$GPG_PASSPHRASE" deploy
